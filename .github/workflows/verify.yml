name: Verify Surface Layer Studio
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Compile Python modules
        run: python -m compileall -q surface_layer_studio tests
      - name: Build extension
        run: python scripts/build_extension.py
      - name: Run pure Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Archive source for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-layer-studio-source
          retention-days: 14
          path: |
            surface_layer_studio/
            tests/
            scripts/
            docs/
            dist/
            README.md
            CHANGELOG.md
            LICENSE
            !**/__pycache__/**
